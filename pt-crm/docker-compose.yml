# FloorScribe — production-oriented compose for Proxmox LXC / Docker hosts
# Usage:
#   cp .env.example .env   # set AUTH_SECRET and CLIENT_AUTH_SECRET
#   docker compose up -d --build
#   curl -s http://localhost:4000/api/health

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: floorscribe:latest
    container_name: floorscribe
    ports:
      # Host:container — app listens on 3000 inside; host default is 4000
      - "${FLOORSCRIBE_PORT:-${PTCRM_PORT:-4000}}:3000"
    environment:
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env — use a long random string}
      CLIENT_AUTH_SECRET: ${CLIENT_AUTH_SECRET:?Set CLIENT_AUTH_SECRET in .env — use a long random string}
      MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN:-}
      MAILTRAP_FROM_EMAIL: ${MAILTRAP_FROM_EMAIL:-hello@floorscribe.com}
      MAILTRAP_FROM_NAME: ${MAILTRAP_FROM_NAME:-FloorScribe}
      MOCK_EMAIL: ${MOCK_EMAIL:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.x.ai/v1}
      AI_MODEL: ${AI_MODEL:-grok-4.5}
      PGLITE_DATA_DIR: /data/pglite
      APP_URL: ${APP_URL:-http://localhost:4000}
    volumes:
      # Persistent client/program/session data — back this up
      - ptcrm_data:/data/pglite
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ptcrm_data:
    name: ptcrm_data
