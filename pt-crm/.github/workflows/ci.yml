name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Lint · Smoke · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Type safety ──────────────────────────────────────────────────────────
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      # ── Lint ─────────────────────────────────────────────────────────────────
      - name: Lint (eslint)
        run: npm run lint

      # ── Smoke tests (pure-lib, no DB required) ────────────────────────────────
      - name: Smoke · floor-a (pure logic)
        run: npm run smoke:floor-a

      - name: Smoke · programming (pure logic)
        run: npm run smoke:programming

      - name: Smoke · library (pure logic)
        run: npm run smoke:library

      - name: Smoke · marketplace (geo, intros, fees)
        run: npm run smoke:marketplace
        env:
          MOCK_EMAIL: "true"
          MOCK_STRIPE: "true"

      # ── Production build ──────────────────────────────────────────────────────
      - name: Build (next build)
        run: npm run build
        env:
          # Required by next build / jose auth; dummy value is fine for CI
          AUTH_SECRET: ci-dummy-secret-at-least-24-chars-long
          APP_URL: http://localhost:4000
          # Skip optional LLM key — rule-based coach runs without it
          XAI_API_KEY: ""
